version: v2
name: blog_posts__simple_semantic_search
data:
  item_dataset:
    name: shaped_blog_chunked
  index:
    search:
      item_fields:
      - name
      - content
      - author
      - categories
      - roles
    embeddings:
    - name: content_embedding
      encoder:
        type: hugging_face
        model_name: sentence-transformers/all-MiniLM-L6-v2
        item_fields:
        - name
        - content
