version: v2
name: hm__clothing_semantic_search
data: 
    item_dataset: 
        name: hm__articles
        query: 
            select * from hm__articles limit 100 
    index: 
        search:
            item_fields: 
                - prod_name
                - prod_type_name
                - product_group_name
                - colour_group_name
                - department_name