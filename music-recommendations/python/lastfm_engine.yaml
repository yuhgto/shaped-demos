# lastfm dataset contains 1000 users and their recent 500 interactions
# the lexical search index enables BM25 search on track and artist names
# the sasrec policy captures sequential listening habits
version: v2
name: lastfm__demo_model
data:
  item_table:
    name: lastfm_items
  user_table:
    name: lastfm_users
    query: select * from lastfm_users order by registered desc
  interaction_table: 
    name: lastfm_interactions
    query: select *, '5' as label from lastfm_interactions
index:
  lexical_search: # search songs by name or artist
    item_fields: 
      - track_name
      - artist_name
training: 
  models: 
    - policy_type: popular
      name: popular
    - policy_type: random
      name: random
    - policy_type: two-tower
      name: two_tower
    - policy_type: sasrec
      name: sasrec